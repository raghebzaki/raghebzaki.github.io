name: ragheb_portfolio
description: "Ragheb Zaki — Senior Flutter Developer portfolio (Flutter Web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  equatable: 3.0.0
  flutter:
    sdk: flutter
  flutter_animate: 4.5.2
  flutter_bloc: 9.1.1
  flutter_svg: 2.3.0
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.2
  scrollable_positioned_list: 0.3.8
  url_launcher: 6.3.3
  vector_graphics: 1.2.3

dev_dependencies:
  bloc_test: 10.0.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  vector_graphics_compiler: 1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - path: assets/icons/
      transformers:
        - package: vector_graphics_compiler

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
